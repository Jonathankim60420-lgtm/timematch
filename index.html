<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeMatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            width: 100%;
            max-width: 760px;
            padding: 40px;
        }

        #title {
            font-size: 11px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #3a3a3a;
        }

        #level-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #level-display {
            font-size: 56px;
            font-weight: bold;
            color: #ffe500;
            letter-spacing: 2px;
            line-height: 1;
        }

        #level-label {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #333;
        }

        #bar-container {
            position: relative;
            width: 100%;
            height: 56px;
            background: #181818;
            border-radius: 4px;
            overflow: hidden;
        }

        #sweet-spot {
            position: absolute;
            height: 100%;
            background: rgba(255, 229, 0, 0.08);
            border-left: 2px solid rgba(255, 229, 0, 0.6);
            border-right: 2px solid rgba(255, 229, 0, 0.6);
            top: 0;
        }

        #slider {
            position: absolute;
            width: 3px;
            height: 100%;
            background: #ffe500;
            box-shadow: 0 0 10px #ffe500, 0 0 20px rgba(255, 229, 0, 0.35);
            top: 0;
            transform: translateX(-50%);
        }

        #message {
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            height: 18px;
            color: transparent;
        }

        #message.success { color: #ffe500; }
        #message.fail    { color: #ff4040; }

        #instruction {
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #333;
        }

        #instruction span {
            color: #666;
        }

        #best-display {
            font-size: 11px;
            letter-spacing: 3px;
            color: #2a2a2a;
            text-transform: uppercase;
        }

        #best-display span { color: #444; }

        #restart-btn {
            display: none;
            background: none;
            border: 1px solid #ffe500;
            color: #ffe500;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            padding: 12px 36px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #restart-btn:hover {
            background: rgba(255, 229, 0, 0.08);
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="title">TimeMatch</div>

    <div id="level-wrap">
        <div id="level-display">1</div>
        <div id="level-label">Level</div>
    </div>

    <div id="bar-container">
        <div id="sweet-spot"></div>
        <div id="slider"></div>
    </div>

    <div id="message"></div>

    <div id="instruction">Press <span>spacebar</span> to stop</div>

    <div id="best-display">Best: <span id="best-level">—</span></div>

    <button id="restart-btn" onclick="restartGame()">Play Again</button>
</div>

<script>
    let level = 1;
    let bestLevel = 0;
    let sliderPos = 0;       // 0–100
    let direction = 1;       // 1 = right, -1 = left
    let animFrame = null;
    let lastTime = null;
    let gameOver = false;
    let paused = false;      // brief pause between levels

    let sweetSpotLeft = 0;
    let sweetSpotWidth = 0;

    let audioCtx = null;
    function ctx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function playSuccess() {
        const c = ctx();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.connect(gain);
        gain.connect(c.destination);
        const base = 900 + (level - 1) * 25;
        osc.frequency.setValueAtTime(base, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(base + 400, c.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
        osc.start(c.currentTime);
        osc.stop(c.currentTime + 0.18);
    }

    function playFail() {
        const c = ctx();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.connect(gain);
        gain.connect(c.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, c.currentTime + 0.35);
        gain.gain.setValueAtTime(0.18, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.35);
        osc.start(c.currentTime);
        osc.stop(c.currentTime + 0.35);
    }

    // Speed in % of bar per second — ramps up with level
    function speed() { return 28 + (level - 1) * 7; }

    // Sweet spot width in % — shrinks with level, floor at 5%
    function zoneWidth() { return Math.max(5, 22 - (level - 1) * 0.9); }

    // Random sweet spot position, guaranteed fully inside bar
    function randomZoneLeft(w) {
        return 3 + Math.random() * (94 - w);
    }

    function setupLevel() {
        sweetSpotWidth = zoneWidth();
        sweetSpotLeft  = randomZoneLeft(sweetSpotWidth);

        document.getElementById('sweet-spot').style.left  = sweetSpotLeft + '%';
        document.getElementById('sweet-spot').style.width = sweetSpotWidth + '%';
        document.getElementById('level-display').textContent = level;
        document.getElementById('message').className = '';
        document.getElementById('message').textContent = '';
        document.getElementById('restart-btn').style.display = 'none';
        document.getElementById('instruction').style.display = '';

        sliderPos = 0;
        direction = 1;
        lastTime  = null;
        gameOver  = false;
        paused    = false;
    }

    function animate(ts) {
        if (lastTime === null) lastTime = ts;
        const dt = (ts - lastTime) / 1000;
        lastTime = ts;

        sliderPos += direction * speed() * dt;

        if (sliderPos >= 100) { sliderPos = 100; direction = -1; }
        else if (sliderPos <= 0) { sliderPos = 0; direction = 1; }

        document.getElementById('slider').style.left = sliderPos + '%';
        animFrame = requestAnimationFrame(animate);
    }

    function stopAnim() {
        if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    }

    function startAnim() {
        stopAnim();
        animFrame = requestAnimationFrame(animate);
    }

    function onTap() {
        if (paused || gameOver) return;

        stopAnim();

        const hit = sliderPos >= sweetSpotLeft && sliderPos <= sweetSpotLeft + sweetSpotWidth;
        const msg = document.getElementById('message');

        if (hit) {
            playSuccess();
            msg.textContent = 'Nice';
            msg.className = 'success';
            if (level > bestLevel) {
                bestLevel = level;
                document.getElementById('best-level').textContent = bestLevel;
            }
            paused = true;
            level++;
            setTimeout(() => { setupLevel(); startAnim(); }, 650);
        } else {
            playFail();
            gameOver = true;
            if (level > bestLevel) {
                bestLevel = level;
                document.getElementById('best-level').textContent = bestLevel;
            }
            msg.textContent = 'Missed — Level ' + level;
            msg.className = 'fail';
            document.getElementById('instruction').style.display = 'none';
            setTimeout(() => {
                document.getElementById('restart-btn').style.display = 'inline-block';
            }, 500);
        }
    }

    function restartGame() {
        level = 1;
        setupLevel();
        startAnim();
    }

    document.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); onTap(); }
    });

    document.addEventListener('touchstart', e => {
        e.preventDefault(); onTap();
    }, { passive: false });

    setupLevel();
    startAnim();
</script>
</body>
</html>
